[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoll-cli"
# Single-sourced from src/pydoll_cli/__init__.py — see [tool.hatch.version].
dynamic = ["version"]
description = "Command-line wrapper around pydoll — automate Chromium-based browsers (Chrome, Edge, Wavebox) via the Chrome DevTools Protocol, no WebDriver required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dovid Gefen" }]
keywords = [
    "pydoll",
    "cli",
    "chrome",
    "chromium",
    "cdp",
    "browser-automation",
    "scraping",
    "headless",
    "wavebox",
    "edge",
    "claude-code",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "pydoll-python>=2.22,<3",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "psutil>=5",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/dovidgef/pydoll-cli"
Repository = "https://github.com/dovidgef/pydoll-cli"
Issues = "https://github.com/dovidgef/pydoll-cli/issues"
"Upstream Library" = "https://github.com/autoscrape-labs/pydoll"

[project.scripts]
pydoll-cli = "pydoll_cli.cli:app"
pydoll = "pydoll_cli.cli:app"

[tool.hatch.version]
path = "src/pydoll_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydoll_cli"]

# Ship the canonical Claude Code skill (SKILL.md + references/) inside the
# wheel so `pydoll-cli install-skill` can write it out for pip-only users.
[tool.hatch.build.targets.wheel.force-include]
".claude/skills/pydoll-cli" = "pydoll_cli/_skill"

[tool.hatch.build.targets.sdist]
include = [
    "src/pydoll_cli",
    ".claude/skills/pydoll-cli",
    "examples",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "ty>=0.0.1a5 ; python_version >= '3.10'",
    "types-psutil>=5",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0912", "PLR0911", "PLR2004", "E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests launch a real browser, so a bare `pytest` skips them; a
# `-m` on the command line overrides this one. Run them with `-m integration`.
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: requires a real browser; opt-in via `-m integration`",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
files = ["src/pydoll_cli"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# pydoll is not fully typed; don't fail on its untyped surfaces.
disable_error_code = ["no-untyped-call"]

[tool.ty.src]
include = ["src"]
